name: Android APK

on:
  push:
    branches: [ main, claude/android ]
    paths:
      - 'StandaloneApp/**'
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fetch raylib 5.5
        run: git clone --depth 1 --branch 5.5 https://github.com/raysan5/raylib.git android/raylib

      - name: Build APK
        run: |
          set -o pipefail
          NDK_VER=$(grep '^Pkg.Revision' "$ANDROID_NDK_HOME/source.properties" | cut -d= -f2 | tr -d ' ')
          echo "Using NDK $NDK_VER at $ANDROID_NDK_HOME"
          gradle -p android assembleRelease -PndkVer="$NDK_VER" --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Report build failure as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Build log excerpt for run $GITHUB_RUN_ID (commit $GITHUB_SHA)."
            echo
            echo "### Errors"
            echo '```'
            grep -nE "error:|error |Error|FAILED|What went wrong|Caused by|fatal|undefined reference|not found|No such" build.log | head -60 || true
            echo '```'
            echo "### Last 120 lines"
            echo '```'
            tail -n 120 build.log
            echo '```'
          } | head -c 60000 > report.md
          gh issue create --title "Android build failed (run $GITHUB_RUN_ID)" --body-file report.md

      - name: Collect APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/GeometricDungeon-android.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: GeometricDungeon-android
          path: dist/GeometricDungeon-android.apk

      - name: Publish pre-release 'android-latest'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest dist/GeometricDungeon-android.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "Android APK (latest build)" \
            --notes "Debug-signed APK built from commit $GITHUB_SHA ($GITHUB_REF_NAME). Enable 'Install unknown apps' for your browser or file manager, then open the APK."
