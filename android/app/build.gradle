plugins {
    id 'com.android.application'
}

android {
    namespace 'com.quang.geometricdungeon'
    compileSdk 34
    // Phiên bản NDK do workflow truyền vào (-PndkVer=...); dùng NDK có sẵn trên máy
    if (project.hasProperty('ndkVer')) {
        ndkVersion project.property('ndkVer')
    }

    defaultConfig {
        applicationId 'com.quang.geometricdungeon'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static",
                          "-DRAYLIB_DIR=${rootDir}/raylib",
                          "-DGAME_SOURCE=${rootDir}/../StandaloneApp/main.cpp"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Ký bằng khoá debug để APK cài được ngay (không cần keystore riêng)
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
